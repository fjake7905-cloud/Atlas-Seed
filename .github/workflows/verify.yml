name: Verify Atlas Seed

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Atlas change guard
        run: python scripts/change_guard.py

      - name: Run Atlas verification tool
        run: python scripts/verify_atlas.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
